<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pause a little</title>
<meta name="description" content="A calm focus timer and a quiet room for Indian classical music.">
<meta name="theme-color" content="#f6e7e1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="pause a little">
<meta name="application-name" content="pause a little">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='35%25'%3E%3Cstop offset='0' stop-color='%23fbe3ef'/%3E%3Cstop offset='.55' stop-color='%23d8c8f0'/%3E%3Cstop offset='1' stop-color='%23bfe0e4'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f6e7e1;transition:background-color 1.4s}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;opacity:0;visibility:hidden;
    transition:opacity 1.4s cubic-bezier(.4,0,.2,1),visibility 0s linear 1.4s}
  iframe.on{opacity:1;visibility:visible;transition:opacity 1.4s cubic-bezier(.4,0,.2,1),visibility 0s}
</style>
</head>
<body>
<iframe id="timer" title="Focus timer" data-src="timer.html" allow="autoplay; fullscreen; screen-wake-lock"></iframe>
<iframe id="raag" title="Raag" data-src="raag.html" allow="autoplay; fullscreen; screen-wake-lock; encrypted-media; picture-in-picture"></iframe>
<script>
(() => {
  const F = { timer: document.getElementById('timer'), raag: document.getElementById('raag') };
  const meta = document.querySelector('meta[name="theme-color"]');
  const info = { timer: {}, raag: {} };
  let view = null;

  const load = f => f.src ? Promise.resolve() : new Promise(r => { f.onload = () => r(); f.src = f.dataset.src; });
  const nameOf = win => Object.keys(F).find(k => F[k].contentWindow === win);

  function syncChrome() {
    const i = info[view] || {};
    if (i.title) document.title = i.title;
    if (i.theme) { meta.content = i.theme; document.body.style.backgroundColor = i.theme; }
  }
  async function show(v) {
    if (!F[v]) v = 'timer';
    if (v === view) return;
    view = v;
    await load(F[v]);
    if (view !== v) return;
    for (const k in F) F[k].classList.toggle('on', k === v);
    syncChrome();
    setTimeout(() => { try { F[v].contentWindow.focus(); } catch (e) {} }, 60);
  }
  const fromHash = () => show(location.hash.slice(1) || 'timer');
  addEventListener('hashchange', fromHash);

  addEventListener('message', e => {
    const who = nameOf(e.source), d = e.data;
    if (!who || !d || typeof d !== 'object') return;
    if (d.title) info[who].title = d.title;
    if (d.theme) info[who].theme = d.theme;
    if (who === view) syncChrome();
    if (d.go && F[d.go]) location.hash = d.go;
    if (d.playing) for (const k in F) if (k !== who && F[k].src) F[k].contentWindow.postMessage({ quiet: 1 }, '*');
    if (d.wake) { const [w, off] = d.wake.split('-'); off ? awake.delete(w) : awake.add(w); syncWake(); }
    if (d.fs) {
      try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (err) {}
    }
  });

  // the shell holds the screen awake for whichever room asks
  const awake = new Set();
  let lock = null;
  async function syncWake() {
    try {
      if (awake.size && !lock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      } else if (!awake.size && lock) { await lock.release(); lock = null; }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', syncWake);

  fromHash();
  // warm up the other room quietly once the first one has settled
  setTimeout(() => { load(F.raag); load(F.timer); }, 2500);
})();
</script>
</body>
</html>
